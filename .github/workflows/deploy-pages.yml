name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Opal
        run: gem install opal --version 1.8.2

      # GitHub Pages serves this repo under /slides/, but docs/ is built
      # with no base path by default so it also works from a plain local
      # server (ruby -run -e httpd docs). Rebuild with BASE_PATH set for
      # this deployment.
      - name: Build with /slides base path
        run: BASE_PATH=/slides ruby build.rb

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
